<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2a5a8c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Box/truck icon -->
    <rect x="-80" y="-60" width="160" height="120" rx="12" fill="#fff" opacity="0.95"/>
    <rect x="-65" y="-45" width="130" height="50" rx="6" fill="#28a745" opacity="0.8"/>
    <text x="0" y="-10" text-anchor="middle" font-size="48" font-weight="bold" fill="#fff" font-family="Tahoma">📦</text>
    <!-- Arrows -->
    <polygon points="-40,80 0,50 40,80" fill="#ffc107" opacity="0.9"/>
    <polygon points="-40,100 0,130 40,100" fill="#28a745" opacity="0.9"/>
